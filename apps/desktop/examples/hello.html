<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Local page</title>
    <style>
      body {
        margin: 0;
        padding: 32px;
        font:
          15px/1.5 -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        color: #c9d1d9;
        background: #0b0e14;
      }
      h1 {
        font-size: 22px;
      }
      code {
        padding: 2px 6px;
        background: #161b22;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>A local HTML file in a web pane</h1>
    <p>This page is read straight from disk. Its address is a plain path.</p>
    <p>Type <code>localhost:3000</code> in the address field to load a dev server instead.</p>
  </body>
</html>
