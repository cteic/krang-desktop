# Research: a lab notebook note, the graph made from it, and an agent that
# makes the graph.
#
# This layout uses a small demo vault at ~/discourse-demo. Create it first:
#
#   kd vault init ~/discourse-demo --example
#
# Then copy this file and board.toml to the app's layouts folder (see the
# README) and open both as tabs of one window:
#
#   open "krang-desktop://layout/lab+board"
#
# Ask the chat pane: Use the discourse-graph skill on the lab notebook note.
# The graph redraws within a few seconds of each new node or relation.
# Double-click a node in the graph to open its note beside it. Select text in
# a note and press Node to make a node of it.
name = "lab"
title = "Research"
color = "green"

# A narrow column, the note, and a wide column. `sizes` are relative.
[[panes]]
id = "root"
split = "vertical"
children = ["left", "note", "thinking"]
sizes = [2, 3, 5]

# The narrow column: the vault's files over a shell.
[[panes]]
id = "left"
split = "horizontal"
children = ["files", "shell"]
sizes = [3, 2]

# The wide column: the graph, over a chat with an agent that can edit the vault.
[[panes]]
id = "thinking"
split = "horizontal"
children = ["graph", "chat"]
sizes = [2, 1]

[[panes]]
id = "files"
type = "files"
title = "Vault"
directory = "~/discourse-demo"

[[panes]]
id = "shell"
type = "terminal"
title = "Shell"
directory = "~/discourse-demo"

[[panes]]
id = "note"
type = "editor"
title = "Lab notebook"
path = "~/discourse-demo/Lab notebook - starter trial.md"
mode = "preview"      # or "edit" or "split"

[[panes]]
id = "graph"
type = "graph"
title = "Discourse graph"
directory = "~/discourse-demo"
view = "all"          # or a canvas file name
is_focused = true

[[panes]]
id = "chat"
type = "chat"
title = "Agent"
agent = "claude"
directory = "~/discourse-demo"
mode = "edit"         # or "read-only", which is what a chat starts in
