[package]
name = "desktop"
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
libc = "0.2.191"
portable-pty = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2.5.5", features = ["deep-link"] }
uuid = { version = "1.29.2", features = ["v7"] }
